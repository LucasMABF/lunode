name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, lint, test & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Flake check
        run: nix flake check

      - name: Build
        run: nix develop -c cargo build --workspace --locked

      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: nix develop -c cargo test --workspace --locked
